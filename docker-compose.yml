services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamapex
      POSTGRES_PASSWORD: dreamapex
      POSTGRES_DB: dreamapex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dreamapex:dreamapex@db:5432/dreamapex
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on: [db, redis]
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on: [backend]
volumes:
  postgres_data:
