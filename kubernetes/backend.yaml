apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamapex-backend
  namespace: dreamapex
spec:
  replicas: 2
  selector:
    matchLabels: {app: dreamapex-backend}
  template:
    metadata:
      labels: {app: dreamapex-backend}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USER/dreamapex-backend:latest
        ports: [{containerPort: 8000}]
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dreamapex-backend
  namespace: dreamapex
spec:
  selector: {app: dreamapex-backend}
  ports: [{port: 8000, targetPort: 8000}]
