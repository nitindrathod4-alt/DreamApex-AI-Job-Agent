apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamapex-frontend
  namespace: dreamapex
spec:
  replicas: 2
  selector:
    matchLabels: {app: dreamapex-frontend}
  template:
    metadata:
      labels: {app: dreamapex-frontend}
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USER/dreamapex-frontend:latest
        ports: [{containerPort: 5173}]
---
apiVersion: v1
kind: Service
metadata:
  name: dreamapex-frontend
  namespace: dreamapex
spec:
  type: LoadBalancer
  selector: {app: dreamapex-frontend}
  ports: [{port: 80, targetPort: 5173}]
